name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      # البناء جزء من البوّابة. إدخال خطوة بناء أدخل عطلاً جديداً: قبله كان
      # الملف المعطوب يُبقي نسخته السابقة تخدم، وبعده قد يُنشَر مخرَج ينقصه
      # ملف فيسقط التطبيق عند التحميل. المُتحقِّق داخل vite.config يرفض أي
      # مخرَج يشير إلى ملف لا يحتويه، والفشل هنا أرخص من اكتشافه لاحقاً.
      - name: Build
        run: npm run build
