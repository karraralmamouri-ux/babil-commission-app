name: Deploy to GitHub Pages

# التطبيق صار يُبنى، فما يُنشَر هو dist لا جذر المستودع.
#
# قبل هذا كان Pages يخدم الجذر مباشرة، وكان لذلك فضيلة واحدة حقيقية: النشر
# لا يفشل. الآن صار يفشل، فوُضعت البوّابات: CI يبني في كل طلب دمج، والبناء
# نفسه يرفض مخرَجاً ينقصه ملف. والنشر السابق يبقى حيّاً إن فشل هذا.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# نشرٌ واحد في كل مرة، ولا يُلغى الجاري: إلغاء نشرٍ في منتصفه يترك الموقع
# في حالة غير معروفة.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
